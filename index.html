<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBL Stock Average Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0c;
            color: #e4e4e7;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(23, 23, 27, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: #1c1c21;
            border: 1px solid #2d2d35;
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
        }
        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            outline: none;
        }
        .cbl-logo-text {
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .column-current {
            background: rgba(59, 130, 246, 0.04);
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 1.25rem;
        }
        .column-new {
            background: rgba(16, 185, 129, 0.04);
            border: 1px solid rgba(16, 185, 129, 0.1);
            border-radius: 1.25rem;
        }
        /* Mobile adjustment for padding */
        @media (max-width: 640px) {
            .glass-card { padding: 1.25rem; }
            .column-current, .column-new { padding: 1rem; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 py-8">

    <div class="w-full max-w-4xl">
        <!-- Header -->
        <div class="mb-6 text-center">
            <h2 class="text-[10px] font-bold uppercase tracking-widest text-blue-500 mb-1">Portfolio Utility</h2>
            <h1 class="text-2xl md:text-3xl font-bold cbl-logo-text">CBL STOCK CALCULATOR</h1>
        </div>

        <div class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl">
            <!-- Main Responsive Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Current Holding Section -->
                <div class="column-current p-5 md:p-6 flex flex-col justify-between">
                    <div>
                        <h3 class="text-xs font-semibold text-blue-400 mb-5 flex items-center">
                            <span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>
                            CURRENT HOLDING
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[10px] text-gray-500 mb-1 ml-1 uppercase">No. of Shares</label>
                                <input type="text" id="currentShares" inputmode="decimal" placeholder="0" class="input-field w-full px-4 py-3 rounded-xl text-lg font-medium">
                            </div>
                            <div>
                                <label class="block text-[10px] text-gray-500 mb-1 ml-1 uppercase">Avg. Cost per Share (BDT)</label>
                                <input type="text" id="currentAvgPrice" inputmode="decimal" placeholder="0.00" class="input-field w-full px-4 py-3 rounded-xl text-lg font-medium">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-6 bg-blue-600/10 p-4 rounded-2xl border border-blue-500/20">
                        <p class="text-[10px] text-blue-400 mb-1 uppercase font-bold">Current Value</p>
                        <p id="resCurrentValue" class="text-lg md:text-xl font-bold text-white">0.00 <span class="text-xs font-normal text-gray-400">Cr. BDT</span></p>
                    </div>
                </div>

                <!-- New Purchase Section -->
                <div class="column-new p-5 md:p-6 flex flex-col justify-between">
                    <div>
                        <h3 class="text-xs font-semibold text-emerald-400 mb-5 flex items-center">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full mr-2"></span>
                            NEW PURCHASE
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[10px] text-gray-500 mb-1 ml-1 uppercase">No. of Shares</label>
                                <input type="text" id="newShares" inputmode="decimal" placeholder="0" class="input-field w-full px-4 py-3 rounded-xl text-lg font-medium">
                            </div>
                            <div>
                                <label class="block text-[10px] text-gray-500 mb-1 ml-1 uppercase">Buy Rate (BDT)</label>
                                <input type="text" id="buyRate" inputmode="decimal" placeholder="0.00" class="input-field w-full px-4 py-3 rounded-xl text-lg font-medium">
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 bg-emerald-600/10 p-4 rounded-2xl border border-emerald-500/20">
                        <p class="text-[10px] text-emerald-400 mb-1 uppercase font-bold">Required for New Buy</p>
                        <p id="resFundsRequired" class="text-lg md:text-xl font-bold text-white">0.00 <span class="text-xs font-normal text-gray-400">Cr. BDT</span></p>
                    </div>
                </div>
            </div>

            <!-- Global Results -->
            <div class="mt-6 pt-6 border-t border-gray-800">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="bg-black/40 p-4 rounded-2xl border border-white/5">
                        <p class="text-[10px] text-gray-500 mb-1 uppercase">Total Shares</p>
                        <p id="resTotalShares" class="text-lg font-bold text-white">0</p>
                    </div>
                    <div class="bg-black/40 p-4 rounded-2xl border border-white/5">
                        <p class="text-[10px] text-gray-500 mb-1 uppercase">New Avg. Price</p>
                        <p id="resAvgPrice" class="text-lg font-bold text-blue-400">0.00</p>
                    </div>
                    <div class="bg-indigo-600/20 p-4 rounded-2xl border border-indigo-500/30">
                        <p class="text-[10px] text-indigo-300 mb-1 font-bold uppercase">Total Value (New)</p>
                        <p id="resTotalValue" class="text-lg font-bold text-white">0.00 <span class="text-xs font-normal text-gray-400">Cr.</span></p>
                    </div>
                </div>
            </div>

            <button onclick="resetCalculator()" class="mt-6 w-full py-2 text-[11px] font-semibold text-gray-600 hover:text-red-400 transition-colors uppercase tracking-widest">
                Reset Form
            </button>
        </div>

        <p class="text-center mt-6 text-gray-700 text-[10px] uppercase tracking-widest">
            City Bank Limited • Investment Analysis Tool
        </p>
    </div>

    <script>
        const inputs = ['currentShares', 'currentAvgPrice', 'newShares', 'buyRate'];
        
        const formatOutput = (val, decimals = 2) => {
            return val.toLocaleString('en-US', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        };

        const getRawValue = (id) => {
            const val = document.getElementById(id).value.replace(/,/g, '');
            return parseFloat(val) || 0;
        };

        const handleInput = (e) => {
            let value = e.target.value.replace(/[^0-9.]/g, '');
            const parts = value.split('.');
            if (parts.length > 2) value = parts[0] + '.' + parts.slice(1).join('');

            if (value !== "") {
                const n = parts[0];
                const d = parts[1] !== undefined ? '.' + parts[1] : '';
                e.target.value = n.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + d;
            } else {
                e.target.value = "";
            }
            calculate();
        };

        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', handleInput);
        });

        function calculate() {
            const currentShares = getRawValue('currentShares');
            const currentAvgPrice = getRawValue('currentAvgPrice');
            const newShares = getRawValue('newShares');
            const buyRate = getRawValue('buyRate');

            const CRORE = 10000000;

            const currentTotalCost = currentShares * currentAvgPrice;
            const newBuyCost = newShares * buyRate;
            const overallTotalCost = currentTotalCost + newBuyCost;
            
            const totalShares = currentShares + newShares;
            const newAvgPrice = totalShares > 0 ? (overallTotalCost / totalShares) : 0;
            
            const currentValCrore = currentTotalCost / CRORE;
            const fundsRequiredCrore = newBuyCost / CRORE;
            const totalValueCrore = overallTotalCost / CRORE;

            document.getElementById('resCurrentValue').innerHTML = `${formatOutput(currentValCrore)} <span class="text-xs font-normal text-gray-500">Cr.</span>`;
            document.getElementById('resFundsRequired').innerHTML = `${formatOutput(fundsRequiredCrore)} <span class="text-xs font-normal text-gray-500">Cr.</span>`;
            
            document.getElementById('resTotalShares').textContent = totalShares.toLocaleString('en-US');
            document.getElementById('resAvgPrice').textContent = formatOutput(newAvgPrice);
            document.getElementById('resTotalValue').innerHTML = `${formatOutput(totalValueCrore)} <span class="text-xs font-normal text-gray-500">Cr.</span>`;
        }

        function resetCalculator() {
            inputs.forEach(id => {
                document.getElementById(id).value = '';
            });
            calculate();
        }
    </script>
</body>
</html>
